name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API · lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fdt
          POSTGRES_PASSWORD: fdt
          POSTGRES_DB: fdt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fdt -d fdt_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The suite drops and recreates the public schema, so this must stay a throwaway
      # database. The workflow provisions one; never point it at anything shared.
      FDT_TEST_DATABASE_URL: postgresql+psycopg://fdt:fdt@localhost:5432/fdt_test
      # env.py reads FDT_DATABASE_URL, not the test-only alias, so the `alembic`
      # steps below need it as well. Without it they silently fall back to the
      # config default `.../fdt`, a database this service never creates.
      FDT_DATABASE_URL: postgresql+psycopg://fdt:fdt@localhost:5432/fdt_test
      FDT_JWT_SECRET: ci-secret-0123456789abcdefghijklmnop
      FDT_ENVIRONMENT: development
      FDT_DEMO_MODE: "false"
      FDT_ML_FALLBACK: "true"
      FDT_DATA_DIR: ${{ github.workspace }}/backend/data

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check app tests scripts

      - name: ruff (format drift is reported, not enforced)
        run: ruff format --check app tests scripts || true

      - name: mypy --strict (core, domain and ml must be fully typed)
        run: mypy app/core app/domain app/ml

      - name: pytest
        run: pytest -q --junitxml=report.xml

      - name: migrations round-trip
        # The downgrade has to tear down what the upgrade built — enums included,
        # since Alembic never autogenerates their teardown — or the second upgrade
        # dies on DuplicateObject. `alembic check` then asserts the rebuilt schema
        # still matches app.models, so a migration can never drift from the ORM.
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: backend/report.xml
          retention-days: 7

  web:
    name: Web · test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # The console's sign-in path is only exercised here. It had no test coverage at all
      # while the client silently authenticated itself as the demo commander on every
      # deployment, so nothing would have caught that behaviour — or its removal.
      - name: Test (node:test, no dependencies)
        run: npm test

      - name: Build
        run: npm run build

      - name: Assert the 3D assets were copied into the bundle
        # A missing .glb is invisible to `vite build` — it only fails at runtime, in the
        # browser, as an empty scene. Check the output here instead.
        run: |
          for asset in rafale.glb landing-gear.glb radar.glb engine.bin.gz engine.meta.json; do
            test -f "dist/models/$asset" || { echo "::error::dist/models/$asset is missing"; exit 1; }
          done
          du -sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 7

  images:
    name: Docker · build both images
    runs-on: ubuntu-latest
    needs: [api, web]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          load: true
          tags: fdt-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: false
          load: true
          tags: fdt-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: nginx configuration is valid
        # FDT_API_HOST=127.0.0.1 so the upstream resolves without a Compose network.
        # Validating this against the literal `api` service name would only fail on DNS,
        # which would say nothing about the config being correct.
        run: |
          docker run --rm -e FDT_API_HOST=127.0.0.1 --entrypoint nginx fdt-web:ci -t

      - name: Compose file is valid
        run: |
          FDT_JWT_SECRET=ci docker compose config --quiet
          FDT_JWT_SECRET=ci docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet