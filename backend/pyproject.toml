[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-digital-twin-backend"
version = "1.0.0"
description = "Predictive-maintenance backend for the Fleet Digital Twin"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pyjwt>=2.9",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt<4.1",
  "xgboost>=2.1",
  "numpy>=1.26",
]

[project.optional-dependencies]
# httpx is required transitively by fastapi.testclient, which every test uses.
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7", "mypy>=1.13"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4"]
# B008: FastAPI Depends() in defaults is idiomatic
# F821: SQLAlchemy Mapped["X"] forward refs are resolved by the ORM, not by ruff
# E501: line length is enforced by the formatter, not the linter
ignore = ["B008", "F821", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N806", "UP042", "B905", "SIM117", "F841"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["xgboost.*", "numpy.*", "passlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
